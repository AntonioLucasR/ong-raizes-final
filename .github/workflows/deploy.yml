name: Build e deploy

# Pull requests: só conferem se o build funciona.
# Push na main: gera o build e publica no GitHub Pages.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o ffmpeg (compressão da imagem)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Gerar o build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Conferir os arquivos gerados
        run: |
          test -f dist/index.html
          test -f dist/css/app.min.css
          test -f dist/js/app.min.js
          test -f dist/imagens/muda-nas-maos.webp
          ls -lh dist dist/css dist/js dist/imagens

      - name: Preparar o site para o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
